name: Wheels

# Prebuilt wheels let users install with `uvx aerospace-mcp` (or pip) without
# a Rust toolchain. The extension is built against the stable ABI (abi3,
# Python >= 3.11), so one wheel per platform covers every Python version.
#
# Pull requests that touch packaging, and a weekly run, build and smoke-test
# the wheels; a `v*` tag additionally publishes them to PyPI via trusted
# publishing.

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "rust/**"
      - "aerospace_mcp/**"
      - "app/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/smoke_installed.py"
      - ".github/workflows/wheels.yml"
  push:
    tags: [ "v*" ]
  # Fresh installs resolve the newest dependencies, not uv.lock, so an
  # upstream release can break `uvx aerospace-mcp` with no change here.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { platform: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { platform: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { platform: macos-x86_64, os: macos-15-intel, target: x86_64 }
          - { platform: macos-arm64, os: macos-latest, target: aarch64 }
          - { platform: windows-x64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          # Oldest macOS the wheel supports (numpy/scipy wheels need 11+ too)
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Install each wheel the way a user would, on a runner of that platform,
  # and exercise the CLI, the MCP stdio server and the HTTP server.
  # --no-build forbids every source build, so a missing wheel (ours or a
  # dependency's) fails here instead of silently needing Rust or a compiler.
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-24.04-arm, python: "3.14" }
          - { os: macos-15-intel, python: "3.14" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run a tool through uvx (the one-line install)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: >
          uvx --python ${{ matrix.python }} --no-build
          --find-links "$GITHUB_WORKSPACE/dist"
          --from aerospace-mcp aerospace-mcp-cli
          run hohmann_transfer --r1_m 6778000 --r2_m 42164000

      - name: Smoke-test the installed package
        shell: bash
        working-directory: ${{ runner.temp }}
        run: >
          uv run --no-project --python ${{ matrix.python }} --no-build
          --find-links "$GITHUB_WORKSPACE/dist" --with aerospace-mcp
          python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aerospace-mcp/
    permissions:
      id-token: write  # PyPI trusted publishing; no API token stored
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
